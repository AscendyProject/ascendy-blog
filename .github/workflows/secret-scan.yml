name: secret-scan

# PR/푸시마다 시크릿 스캔. redaction-checklist §0~§1(자격증명/토큰/키)의
# 시스템 레벨 백스톱 — 사람/에이전트 수동 grep이 놓친 시크릿을 CI에서 차단.
#
# gitleaks CLI(MIT, 무료)를 도커로 직접 실행한다. 공식 gitleaks-action은
# 조직 repo에 GITLEAKS_LICENSE를 요구하므로 쓰지 않는다(CLI는 라이선스 불필요,
# fork PR에서도 동작). --redact로 발견된 시크릿 값이 CI 로그에 찍히지 않게 한다.
#
# 한계: 알려진 패턴(AWS/GitHub/private key 등)을 잡는 완화 수단이지 만능이 아니다.
# 사내 식별자(클러스터/버킷/레지스트리 실명 등)는 공개 워크플로에 패턴을 박으면
# 그 자체가 재노출이므로 여기 넣지 않는다 — 사람/Codex redaction 리뷰가 담당.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks (secret scan)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            dir /repo -c /repo/.gitleaks.toml --no-banner --redact -v
